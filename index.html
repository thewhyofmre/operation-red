<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Red Signal</title>

    <style>
        body {
            background: #0d1117;
            color: #00ff88;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .terminal {
            width: 700px;
            padding: 40px;
            border: 1px solid #00ff88;
            background: #010409;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .red {
            color: #ff4444;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>

<body>

<div class="terminal">

    <h1>VODAFONE // RESTRICTED SYSTEM</h1>

    <p class="red">SECURITY ALERT</p>

    <p>
        Unauthorized activity detected.
    </p>

    <p>
        Internal recovery protocol activated.
    </p>

    <br>

    <p>
        STATUS: LOCKED
    </p>

    <p>
        Waiting for authentication...
        <span class="blink">_</span>
    </p>

</div>

</body>
</html>
